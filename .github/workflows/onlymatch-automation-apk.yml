name: Build OnlyMatch Automation APK
on:
  push:
    branches: [onlymatch-automation-preview]
    paths-ignore:
      - 'OnlyMatch-Automation-debug.apk'
  pull_request:
    branches: [onlymatch-automation-preview]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK to preview branch
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OnlyMatch-Automation-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OnlyMatch-Automation-debug.apk
          git commit -m "Publish OnlyMatch Android preview APK" || true
          git push origin HEAD:onlymatch-automation-preview
      - uses: actions/upload-artifact@v4
        with:
          name: OnlyMatch-Automation-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
