function sidebar(){const navEl=$('#sidebar-nav');navEl.innerHTML=nav.map(group=>(group.group?`<div class="nav-heading">${group.group}</div>`:'')+group.items.map(([id,label,ico])=>`<a href="#/${id}" class="nav-link ${currentPage===id?'active':''}" data-nav="${id}">${icon(ico)}<span>${label}</span></a>`).join('')).join('');$('#sidebar-balance').textContent=money(state.balance-state.reserved);$('#sidebar-work-switch').checked=state.working}
function openSidebar(){ $('#sidebar').classList.add('open');$('#sidebar-overlay').classList.add('open');document.body.style.overflow='hidden';$('#open-menu').setAttribute('aria-expanded','true') }
function closeSidebar(){ $('#sidebar').classList.remove('open');$('#sidebar-overlay').classList.remove('open');document.body.style.overflow='';$('#open-menu').setAttribute('aria-expanded','false') }
const title=(s)=>`<h1 class="page-title">${esc(s)}</h1><div class="page-title-rule"></div>`;
const metric=(label,value,dotColor='')=>`<div class="metric"><div class="metric-label"><i class="dot ${dotColor}"></i>${label}</div><div class="metric-value">${value}</div></div>`;
const workLabel=()=>`<span class="work-status ${state.working?'on':'off'}">${state.working?'В работе':'Не в работе'}</span>`;
function home(){return `${title('Главная')}<div class="section-card"><div class="section-header"><h2>Балансы</h2><button class="text-link" data-go="wallet">Открыть кошелёк</button></div><div class="metric-grid">${metric('<strong>USDT</strong> Общий баланс',money(state.balance)+' USDT')}${metric('<strong>USDT</strong> Доступно',money(Math.max(0,state.balance-state.reserved))+' USDT','green')}${metric('<strong>USDT</strong> В резерве',money(state.reserved)+' USDT','yellow')}${metric('<strong>USDT</strong> Страховой депозит',money(state.insurance)+' USDT','peach')}</div><h2 class="subsection-title">Рабочее состояние</h2><div class="metric-grid">${metric('Статус',workLabel())}${metric('Реквизиты',`${state.records.filter(r=>r.status==='active').length} из ${state.records.length} активны`)}${metric('Апелляции Pay-In',state.appeals.filter(a=>a.kind==='Pay-In'&&a.status!=='success').length)}${metric('Апелляции Pay-Out',state.appeals.filter(a=>a.kind==='Pay-Out'&&a.status!=='success').length)}</div><h2 class="stats-heading">Статистика и профит</h2><p class="stats-description">Профит считается по фактически начисленной комиссии завершённых сделок. Демонстрационные операции не начисляют прибыль.</p><div class="period-toolbar"><label class="date-field">От<input type="date" id="date-from" value="${fromDate}"></label><label class="date-field">До<input type="date" id="date-to" value="${toDate}"></label><div class="period-pills">${[['today','Сегодня'],['yesterday','Вчера'],['7','7 дней'],['30','30 дней']].map(([v,l])=>`<button class="chip ${dateRange===v?'selected':''}" data-period="${v}">${l}</button>`).join('')}</div></div><div class="profit-strip"><div><small>Общий профит</small><strong>0,00 USDT</strong></div><div><small>Профит Pay-In</small><strong>0,00 USDT</strong></div><div><small>Профит Pay-Out</small><strong>0,00 USDT</strong></div></div><div class="stat-panels">${statPanel('Pay-In')}${statPanel('Pay-Out')}</div><h2 class="subsection-title">Тарифные линии группы</h2><p class="stats-description">Актуальные методы и лимиты Pay-In и Pay-Out для вашей группы · демонстрационные значения</p>${tariffTable()}</div>`}
function statPanel(kind){return `<div class="stat-panel"><div class="stat-panel-head"><div class="stat-panel-label"><small>Выполнено платежей</small><strong class="${kind==='Pay-Out'?'payout':''}">${kind}</strong></div><div class="conversion">Конверсия<br>0%</div></div><div class="stat-panel-grid"><div class="stat-cell"><small>Создано</small><strong>0</strong></div><div class="stat-cell"><small>Успешно</small><strong class="good">0</strong></div><div class="stat-cell"><small>Оборот</small><strong>0 RUB</strong></div><div class="stat-cell"><small>Средний чек</small><strong>0 RUB</strong></div></div><div class="stat-panel-foot"><div><small>Профит трейдера</small><strong>0,00 USDT</strong></div><div><small>Отменено</small><strong style="color:#ff8e95">0</strong></div></div></div>`}
function tariffTable(){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Направление</th><th>Метод</th><th>Валюта</th><th>Диапазон</th><th>Комиссия</th><th>Корр. курса</th></tr></thead><tbody><tr><td><span class="status-pill pending">Pay-In</span></td><td>Банковская карта</td><td>RUB</td><td>1 000–500 000</td><td>Демо 2%</td><td>0%</td></tr><tr><td><span class="status-pill active">Pay-Out</span></td><td>Перевод</td><td>RUB</td><td>1 000–500 000</td><td>Демо 1%</td><td>0%</td></tr></tbody></table></div>`}
const statusMap={pending:'В обработке',success:'Успешно',expired:'Истекло',failed:'Ошибка',active:'Активно',archived:'Архив',paid:'Оплачено'};
const statusTag=s=>`<span class="status-pill ${esc(s)}">${esc(statusMap[s]||s)}</span>`;
const dateFmt=s=>{try{return new Date(s).toLocaleString(document.documentElement.lang==='en'?'en-GB':'ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}};
function tabBar(name,items){return `<div class="segmented" role="tablist">${items.map(([v,l])=>`<button type="button" role="tab" aria-selected="${(tabs[name]||'all')===v}" class="${(tabs[name]||'all')===v?'active':''}" data-tab="${name}:${v}">${l}</button>`).join('')}</div>`}
function orderList(which){let q=(searches[which]||'').toLowerCase(), status=tabs[which]||'all';let data=state.orders.filter(x=>which==='all'||x.kind===(which==='payin'?'Pay-In':'Pay-Out'));if(status!=='all')data=data.filter(x=>x.status===status);if(q)data=data.filter(x=>(x.id+' '+x.currency+' '+x.amount).toLowerCase().includes(q));return `<div class="table-wrap"><table class="data-table"><thead><tr><th>№ заявки</th><th>Тип</th><th>Сумма</th><th>Статус</th><th>Создано</th><th>Детали</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.kind)}</td><td><strong>${money(x.amount,0)} ${esc(x.currency)}</strong></td><td>${statusTag(x.status)}</td><td>${dateFmt(x.created)}</td><td><button class="table-link" data-detail="order:${esc(x.id)}">Открыть</button></td></tr>`).join('')||`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:35px">Нет заявок по заданным фильтрам</td></tr>`}</tbody></table></div>`}
function transactions(which){return `${title(which==='payin'?'Pay-In':'Pay-Out')}<div class="info-strip">Все операции здесь демонстрационные. Включение рабочего статуса и создание тестовых заявок не запускают настоящие переводы.</div><div class="action-row"><button class="gradient-button" data-action="new-${which}">${icon('plus')} Создать тестовую заявку</button><button class="secondary-button" data-export="${which}">${icon('download')} Экспорт CSV</button></div><div class="section-card"><div class="section-header"><h2>История ${which==='payin'?'Pay-In':'Pay-Out'}</h2><span class="volume-small">Всего: ${state.orders.filter(x=>x.kind===(which==='payin'?'Pay-In':'Pay-Out')).length}</span></div><div class="filters">${tabBar(which,[['all','Все'],['pending','Активные'],['success','Успешные'],['expired','Истекшие']])}<input type="search" data-search="${which}" value="${esc(searches[which]||'')}" placeholder="Поиск по номеру и сумме"></div>${orderList(which)}</div>`}
function requisites(){const active=state.records.filter(r=>r.status==='active').length;let list=state.records.filter(r=>r.status===(tabs.requisites||'active'));let q=(searches.requisites||'').toLowerCase();if(q)list=list.filter(r=>(r.name+' '+r.type+' '+r.detail+' '+r.holder).toLowerCase().includes(q));if(selects.reqtype&&selects.reqtype!=='all')list=list.filter(r=>r.type===selects.reqtype);if(selects.reqstatus&&selects.reqstatus!=='all')list=list.filter(r=>r.status===selects.reqstatus);return `${title('Реквизиты')}<div class="action-row"><button class="gradient-button" data-action="add-requisite">Создать реквизиты</button></div><div class="mini-card-grid"><div class="mini-card"><strong>${state.records.length}</strong><span>Всего реквизитов</span></div><div class="mini-card"><strong>${active}</strong><span>Активных</span></div></div><div class="section-card"><div style="margin-bottom:15px">${tabBar('requisites',[['active','Активные'],['archived','Архив']])}</div><div class="filters"><input data-search="requisites" type="search" placeholder="Поиск по названию, реквизиту, ФИО, банку..." value="${esc(searches.requisites||'')}"><select data-select="reqtype"><option value="all">Все типы</option><option value="🌐 Международная карта" ${selects.reqtype==='🌐 Международная карта'?'selected':''}>Международная карта</option><option value="Банковская карта" ${selects.reqtype==='Банковская карта'?'selected':''}>Банковская карта</option><option value="СБП" ${selects.reqtype==='СБП'?'selected':''}>СБП</option></select><select data-select="reqstatus"><option value="all">Все статусы</option><option value="active" ${selects.reqstatus==='active'?'selected':''}>Активные</option><option value="archived" ${selects.reqstatus==='archived'?'selected':''}>Архивные</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Название</th><th>Тип</th><th>Данные</th><th>Владелец</th><th>Статус</th><th>Действие</th></tr></thead><tbody>${list.map(r=>`<tr><td><strong>${esc(r.name)}</strong></td><td>${esc(r.type)}</td><td>${esc(r.detail)}</td><td>${esc(r.holder)}</td><td>${statusTag(r.status)}</td><td><button class="table-link" data-detail="req:${esc(r.id)}">Подробнее</button></td></tr>`).join('')||'<tr><td colspan="6" style="padding:35px;text-align:center;color:var(--muted)">Реквизиты не найдены</td></tr>'}</tbody></table></div></div>`}
function wallet(){return `${title('Кошелёк')}<div class="wallet-actions"><button class="gradient-button" data-action="deposit">${icon('plus')} Пополнить USDT TRC20</button><button class="gradient-button ice-ton-wallet-btn" type="button" data-ice-ton="open">${icon('wallet')} Пополнить TON</button><button class="gradient-button" data-action="withdraw">Запросить вывод</button></div><div class="ice-ton-wallet-caption"><strong>TON-депозит:</strong> персональный Memo и адрес доступны после входа трейдера. Автоматическое зачисление пока не подключено, баланс ниже — демонстрационный USDT.</div><div class="section-card"><div class="wallet-cards">${[['Основной баланс · TRC20',state.balance],['Доступно',state.balance-state.reserved],['Заблокировано',state.reserved],['Страховой депозит',state.insurance]].map(([label,num])=>`<div class="wallet-tile"><span class="asset-tag">USDT</span><div class="wallet-amount">${money(num)} USDT</div><div class="wallet-caption">${label}</div></div>`).join('')}<div class="wallet-tile"><div class="wallet-amount">${state.walletOps.filter(x=>x.kind==='deposit'&&x.status==='pending').length}</div><div class="wallet-caption">Пополнения в обработке</div></div><div class="wallet-tile"><div class="wallet-amount">${state.walletOps.filter(x=>x.kind==='withdraw'&&x.status==='pending').length}</div><div class="wallet-caption">Выводы в обработке</div></div></div></div><div class="section-card"><div class="section-header"><h2>История кошелька</h2><button class="secondary-button" data-export="wallet">${icon('download')} CSV</button></div>${walletTable()}</div>`}
function walletTable(){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Номер</th><th>Операция</th><th>Сумма</th><th>Создана</th><th>Статус</th></tr></thead><tbody>${state.walletOps.map(x=>`<tr><td>${esc(x.id)}</td><td>${x.kind==='deposit'?'Пополнение':'Запрос вывода'}</td><td>${money(x.amount)} USDT</td><td>${dateFmt(x.created)}</td><td>${statusTag(x.status)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;padding:33px;color:var(--muted)">Операций пока нет</td></tr>'}</tbody></table></div>`}
function payoutRequests(){return `${title('Запросы Pay-Out')}<div class="action-row"><button class="gradient-button" data-action="new-payout">${icon('plus')} Новый запрос</button></div><div class="section-card"><div class="section-header"><h2>Запросы на выплату</h2><span class="volume-small">Тестовая история</span></div><div class="filters"><input type="search" data-search="payout" placeholder="Найти заявку" value="${esc(searches.payout||'')}"></div>${orderList('payout')}</div>`}
function manual(){return `${title('Ручная выдача')}<div class="two-column"><div class="section-card"><div class="section-header"><h2>Создать выдачу</h2></div><p class="section-caption">Тестовая заявка на ручную выдачу. Никакого реального перевода не произойдёт.</p><form id="manual-form"><label class="form-field">Сумма, RUB<input name="amount" type="number" min="1" step="1" required placeholder="Например, 5000"></label><label class="form-field">Способ<select name="method"><option>Банковская карта</option><option>СБП</option><option>Международная карта</option></select></label><label class="form-field">Комментарий<input name="comment" maxlength="100" placeholder="Назначение тестовой операции"></label><button class="gradient-button" type="submit">Создать тестовую выдачу</button></form></div><div class="section-card"><div class="section-header"><h2>Правила работы</h2></div><div class="info-list"><div class="info-row"><span>Рабочий статус</span>${workLabel()}</div><div class="info-row"><span>Доступный баланс</span><strong>${money(state.balance-state.reserved)} USDT</strong></div><div class="info-row"><span>Валюта</span><strong>RUB</strong></div><div class="info-row"><span>Курс Rapira (продажа USDT)</span><strong data-rapira-rate>Загрузка курса…</strong></div></div><p class="section-caption" style="margin-top:15px">Для подключения реальных выплат потребуются защищённая платёжная интеграция и отдельная проверка операций.</p></div></div>`}
function qr(){return `${title('QR')}<div class="two-column"><div class="section-card"><div class="section-header"><h2>QR-операции</h2></div><div class="info-strip">Этот раздел — прототип интерфейса. Генерация платёжного QR и приём денег пока не подключены.</div><form id="qr-form"><label class="form-field">Сумма, RUB<input name="amount" type="number" min="1" step="1" placeholder="Введите сумму" required></label><label class="form-field">Комментарий<input name="comment" maxlength="100" placeholder="Тестовый платёж"></label><button class="gradient-button" type="submit">Создать демо-запрос</button></form></div><div class="section-card"><div class="section-header"><h2>История QR</h2></div>${empty('qr','Пока нет QR-операций','После создания тестового запроса запись появится в разделе Pay-In.')}</div></div>`}
function empty(n,h,p){return `<div class="empty-state">${icon(n)}<h3>${h}</h3><p>${p}</p></div>`}
function traffic(){return `${title('Свободный трафик')}<div class="info-strip">Демонстрационная панель распределения операций. Настоящие входящие заказы не подключены.</div><div class="mini-card-grid"><div class="mini-card"><strong>0</strong><span>Свободных заявок</span></div><div class="mini-card"><strong>0</strong><span>Заявок в работе</span></div></div><div class="section-card"><div class="section-header"><h2>Настройки приёма</h2></div><div class="toggle-row"><div><strong>Принимать Pay-In</strong><small>Автоматическая готовность к приёму тестового трафика</small></div><label><input type="checkbox" data-toggle="autoPayin" ${state.autoPayin?'checked':''}></label></div><div class="toggle-row"><div><strong>Принимать Pay-Out</strong><small>Тестовое разрешение обработки заявок</small></div><label><input type="checkbox" data-toggle="autoPayout" ${state.autoPayout?'checked':''}></label></div>${empty('chart','Свободных операций нет','Когда появятся тестовые заявки, их можно будет просматривать здесь.')}</div>`}
function appeals(){return `${title('Апелляции')}<div class="action-row"><button class="gradient-button" data-action="new-appeal">${icon('plus')} Создать апелляцию</button></div><div class="section-card"><div class="section-header"><h2>Апелляции</h2></div>${state.appeals.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Направление</th><th>Причина</th><th>Статус</th></tr></thead><tbody>${state.appeals.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.kind)}</td><td>${esc(x.reason)}</td><td>${statusTag(x.status)}</td></tr>`).join('')}</tbody></table></div>`:empty('message','Нет активных апелляций','Здесь отображаются запросы по спорным Pay-In и Pay-Out операциям.')}</div>`}
function automation(){return `${title('Автоматизация')}<div class="two-column"><div class="section-card"><div class="section-header"><h2>Автоматические сценарии</h2></div><div class="toggle-row"><div><strong>Автоматически принимать Pay-In</strong><small>Только локальная настройка интерфейса</small></div><input type="checkbox" data-toggle="autoPayin" ${state.autoPayin?'checked':''}></div><div class="toggle-row"><div><strong>Автоматически принимать Pay-Out</strong><small>Демо: не отправляет платежи</small></div><input type="checkbox" data-toggle="autoPayout" ${state.autoPayout?'checked':''}></div><button class="secondary-button" data-action="demo-info">Узнать о подключении API</button></div><div class="section-card"><div class="section-header"><h2>Состояние интеграций</h2></div><div class="info-list"><div class="info-row"><span>Платёжный API</span>${statusTag('archived')}</div><div class="info-row"><span>Банк и реквизиты</span><strong>Демо</strong></div><div class="info-row"><span>Webhooks</span><strong>Не подключены</strong></div></div></div></div>`}
function settings(){return `${title('Настройки')}<div class="two-column"><div class="section-card"><div class="section-header"><h2>Настройки кабинета</h2></div><div class="info-list"><div class="info-row"><span>Платформа</span><strong>Ice Pay</strong></div><div class="info-row"><span>Учетная запись</span><strong>Demo Trader</strong></div><div class="info-row"><span>Язык</span><strong data-ice-locale-value>Русский</strong></div><div class="info-row"><span>Режим</span><strong style="color:var(--yellow)">Демонстрационный</strong></div></div><div class="toggle-row"><div><strong>Рабочий статус</strong><small>Показывать «В работе» в кабинете</small></div><input type="checkbox" data-toggle="working" ${state.working?'checked':''}></div></div><div class="section-card"><div class="section-header"><h2>Демонстрационные данные</h2></div><p>Тестовые операции и реквизиты сохраняются только в этом браузере. Пользовательские сведения никуда не отправляются.</p><button class="danger-button" data-action="reset">Сбросить демо-данные</button></div></div>`}
function notifications(){return `${title('Уведомления')}<div class="section-card"><div class="section-header"><h2>Центр уведомлений</h2><button class="text-link" data-action="mark-read">Отметить прочитанными</button></div>${state.notifications.map(x=>`<div class="toggle-row"><div><strong>${!x.read?'<span class="dot cyan"></span> ':''}${esc(x.title)}</strong><small>${esc(x.detail)}</small></div><small>${esc(x.time)}</small></div>`).join('')||empty('bell','Нет уведомлений','Новых уведомлений пока нет.')}</div>`}

function modal(titleText,body,onSubmit){const root=$('#modal-root');root.innerHTML=`<div class="modal-overlay" data-overlay="true"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titleText)}"><div class="modal-title-row"><h2>${esc(titleText)}</h2><button class="modal-close" data-modal-close="true" aria-label="Закрыть">×</button></div>${body}</div></div>`;const form=$('form',root);if(form&&onSubmit)form.addEventListener('submit',e=>{e.preventDefault();onSubmit(new FormData(form),form)})}

  <script id="ice-blue-responsive-tables">
/* Add mobile column labels to dynamic tables without altering desktop semantics. */
(() => {
  'use strict';
  const root = document.querySelector('#page');
  if (!root) return;
  const annotate = () => {
    for (const table of document.querySelectorAll('.data-table')) {
      const labels = [...table.querySelectorAll('thead th')].map(th => th.textContent.trim());
      for (const row of table.querySelectorAll('tbody tr')) {
        [...row.querySelectorAll('td')].forEach((cell, i) => {
          if (!cell.hasAttribute('colspan')) cell.dataset.label = labels[i] || '';
        });
      }
    }
  };
  annotate();
  new MutationObserver(annotate).observe(root, {subtree:true, childList:true});
})();
</script>
<script id="ice-pay-rapira-live">
(() => {
  'use strict';
  const direct='https://api.rapira.net/open/market/rates';
  const proxy='https://ice-pay-rates.onrender.com/rate';
  const rate={text:'Загрузка курса…',note:'Продажа USDT · Rapira'};
  let preferProxy=false,loading=false;
  function paint(){
    for(const el of document.querySelectorAll('[data-rapira-rate]'))if(el.textContent!==rate.text)el.textContent=rate.text;
    for(const el of document.querySelectorAll('[data-rapira-status]'))if(el.textContent!==rate.note)el.textContent=rate.note;
  }
  async function loadJson(url,timeout){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
    try{
      const response=await fetch(url,{method:'GET',mode:'cors',cache:'no-store',headers:{Accept:'application/json'},signal:controller.signal});
      if(!response.ok)throw new Error('Rate source HTTP '+response.status);
      return await response.json();
    }finally{clearTimeout(timer);}
  }
  function readBid(data){
    const row=Array.isArray(data?.data)?data.data.find(x=>x.symbol==='USDT/RUB'):data;
    if(!row||row.symbol!=='USDT/RUB')throw new Error('Pair USDT/RUB absent');
    const bid=Number(row.bidPrice);
    if(!Number.isFinite(bid)||bid<=0||bid>10000)throw new Error('Invalid Rapira bidPrice');
    return bid;
  }
  async function refreshRate(){
    if(loading)return;
    if(!navigator.onLine){rate.text='Курс недоступен';rate.note='Нет подключения · Rapira';paint();return;}
    loading=true;
    try{
      let bid;
      if(preferProxy) bid=readBid(await loadJson(proxy,75000));
      else{
        try{bid=readBid(await loadJson(direct,10000));}
        catch(error){preferProxy=true;bid=readBid(await loadJson(proxy,75000));}
      }
      rate.text=bid.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽ / USDT';
      rate.note='Продажа USDT · обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    }catch(error){
      rate.text='Курс недоступен';rate.note='Не удалось получить данные Rapira';
      console.warn('Ice Pay: Rapira quote unavailable',error);
    }finally{loading=false;paint();}
  }
  const page=document.querySelector('#page');
  if(page)new MutationObserver(paint).observe(page,{childList:true});
  paint();refreshRate();
  setInterval(()=>{if(!document.hidden)refreshRate()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRate()});
})();
</script>

  const res=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})},cache:'no-store',signal:ctl.signal});
  let data;try{data=await res.json()}catch{data={}}
  if(!res.ok)throw Error(data.error||'Сервер входа недоступен');
  return data;
 }finally{clearTimeout(timer)}
}
function show(account){
 sessionStorage.setItem('ice-pay-trader-id',account.id);
 sessionStorage.setItem('ice-pay-trader-username',account.username);
 if(get('user-button'))get('user-button').textContent=account.username;
 document.documentElement.classList.add('ice-auth-ok');
 overlay.remove();
}
async function verifyExisting(){
 const token=sessionStorage.getItem(TOKEN);
 if(!token)return;
 try{
  const data=await api('/v1/auth/me',{headers:{Authorization:'Bearer '+token}});
  if(data.account?.role!=='trader')throw Error('Только трейдерам доступен этот кабинет');
  show(data.account);
 }catch(e){
  sessionStorage.removeItem(TOKEN);sessionStorage.removeItem('ice-pay-trader-id');
  error('Сессия завершена. Войдите снова.');
 }
}
get('ice-trader-login-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;error('');
 try{
  const d=new FormData(e.target);
  const data=await api('/v1/auth/login',{method:'POST',body:JSON.stringify({username:String(d.get('username')).trim(),password:d.get('password'),role:'trader'})});
  if(data.account?.role!=='trader'||!data.token)throw Error('Нет доступа к кабинету трейдера');
  sessionStorage.setItem(TOKEN,data.token);
  sessionStorage.setItem('ice-pay-trader-id',data.account.id);
  location.reload(); // loads isolated demo data for this account
 }catch(ex){error(ex.message==='Failed to fetch'?'Сервер авторизации недоступен':ex.message);btn.disabled=false;}
});
get('exit-button')?.addEventListener('click',e=>{
 e.preventDefault();e.stopImmediatePropagation();
 const token=sessionStorage.getItem(TOKEN);
 sessionStorage.removeItem(TOKEN);sessionStorage.removeItem('ice-pay-trader-id');sessionStorage.removeItem('ice-pay-trader-username');
 if(token)fetch(API+'/v1/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});
 location.reload();
},true);
verifyExisting();
})();
</script>
<script id="ice-ton-deposit-ui">
(()=>{
'use strict';
const API='https://ice-pay-auth.onrender.com';
const ROOT_ID='ice-ton-root';
const ADDRESS_LENGTH=48;
let address='',memo='';
const escapeText=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function root(){
 let el=document.getElementById(ROOT_ID);
 if(!el){el=document.createElement('div');el.id=ROOT_ID;document.body.appendChild(el)}
 return el;
}
function close(){
 const el=document.getElementById(ROOT_ID);
 if(el)el.replaceChildren();
 if(!document.getElementById('ice-auth-overlay'))document.body.style.overflow='';
}
function shell(body){
 root().innerHTML='<div class="ice-ton-overlay" data-ice-ton-overlay><section class="ice-ton-dialog" role="dialog" aria-modal="true" aria-label="TON депозит"><div class="ice-ton-title-row"><div><span class="ice-ton-chip">TON · Демо, без зачисления</span><h2>Пополнение TON</h2></div><button class="ice-ton-close" type="button" data-ice-ton-close aria-label="Закрыть">×</button></div>'+body+'</section></div>';
 document.body.style.overflow='hidden';
}

async function open(){
 if(!document.documentElement.classList.contains('ice-auth-ok'))return;
 const token=sessionStorage.getItem('ice-pay-trader-token');
 if(!token){shell('<div class="ice-ton-status error">Необходимо войти в аккаунт трейдера.</div>');return;}
 shell('<div class="ice-ton-loading">Загружаем ваши персональные реквизиты…</div>');
 try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),16000);
   let response;
   try{response=await fetch(API+'/v1/trader/ton-deposit',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store',signal:controller.signal})}
   finally{clearTimeout(timer)}
   const data=await response.json();
   if(!response.ok)throw new Error(data.error||'Сервис недоступен');
   if(data.asset!=='TON'||data.network!=='TON Mainnet'||data.status!=='preview_only'||data.autoCreditEnabled!==false)throw new Error('Неверный режим TON-депозита');
   if(typeof data.address!=='string'||data.address.length!==ADDRESS_LENGTH||typeof data.memo!=='string'||!data.memo)throw new Error('Реквизиты не получены');
   address=data.address;memo=data.memo;
   if(!root().querySelector('.ice-ton-overlay'))return;
   shell('<div class="ice-ton-details"><div class="ice-ton-field"><label>Сеть / монета</label><div class="ice-ton-value">TON Mainnet · TON (Toncoin)</div></div>'+
   '<div class="ice-ton-field"><label>Адрес кошелька Ice Pay</label><div class="ice-ton-value mono">'+escapeText(address)+'</div><div class="ice-ton-btnrow"><button class="ice-ton-copy" type="button" data-ice-ton-copy="address">Скопировать адрес</button></div></div>'+
   '<div class="ice-ton-field"><label>Ваш персональный Memo</label><div class="ice-ton-value mono">'+escapeText(memo)+'</div><div class="ice-ton-btnrow"><button class="ice-ton-copy" type="button" data-ice-ton-copy="memo">Скопировать Memo</button></div></div>'+
   '</div>'+

   '<div id="ice-ton-status" role="status" aria-live="polite" class="ice-ton-status"></div>');
 }catch(err){
   if(root().querySelector('.ice-ton-overlay'))shell('<div class="ice-ton-status error" role="alert">'+escapeText(err.message==='Failed to fetch'?'Не удалось связаться с сервером авторизации':err.message)+'</div><button class="ice-ton-copy" data-ice-ton-retry type="button">Попробовать снова</button>');
 }
}
document.addEventListener('click',async e=>{
 const trigger=e.target.closest('[data-ice-ton]');
 if(trigger){
  if(trigger.dataset.iceTon==='open'){e.preventDefault();open();}
  return;
 }
 if(e.target.closest('[data-ice-ton-close]')||e.target.hasAttribute('data-ice-ton-overlay')){close();return;}
 if(e.target.closest('[data-ice-ton-retry]')){open();return;}
 const copy=e.target.closest('[data-ice-ton-copy]');
 if(!copy)return;
 const val=copy.dataset.iceTonCopy==='memo'?memo:address;
 const status=document.getElementById('ice-ton-status');
 if(!val)return;
 try{
  await navigator.clipboard.writeText(val);
  if(status)status.textContent=copy.dataset.iceTonCopy==='memo'?'Memo скопирован':'Адрес скопирован';
 }catch{
  if(status){status.className='ice-ton-status error';status.textContent='Не получилось скопировать. Выделите значение вручную.'}
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.ice-ton-overlay'))close()});
})();
</script>
</body>
