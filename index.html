.om-ps-cancel:hover{background:rgba(225,72,110,.16)}

</head>
<body>
  <div class="shell" id="shell">
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar" aria-label="Основное меню">
      <div class="sidebar-header"><a class="logo" href="#/home">Only<strong>Match</strong></a><button class="sidebar-close icon-btn" id="sidebar-close" aria-label="Закрыть меню"><span data-icon="x"></span></button></div>
      <nav id="sidebar-nav" aria-label="Разделы сайта"></nav>
      <div class="sidebar-footer">
        
        <div class="worker-box">
          <div class="worker-line"><span class="worker-label">БАЛАНС:</span> <strong class="worker-amount" id="sidebar-balance">0,00</strong><span class="worker-unit">USDT</span></div>
          <label class="worker-line switch-line"><span>Встать в работу</span><input type="checkbox" id="sidebar-work-switch" class="switch-input"><span class="switch" aria-hidden="true"></span></label><small id="ice-insurance-gate-label" class="ice-insurance-gate-label">Проверка страхового депозита…</small>
          <div class="rate-box"><span>USDT / RUB</span><strong data-usdt-rub-rate aria-live="polite">Загрузка курса…</strong><small class="quote-caption" data-usdt-rub-status>Актуальный курс за 1 USDT</small></div>
          
        </div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button id="open-menu" class="menu-button" type="button" aria-label="Открыть главное меню" aria-controls="sidebar" aria-expanded="false"><span class="ice-mobile-menu-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span class="menu-text">Меню</span></button>
        <div class="top-actions"><button class="lang-button" id="lang-button" type="button">RU</button><button class="user-button" id="user-button" type="button">Трейдер</button><button class="exit-button" id="exit-button" type="button">Выход</button></div>
      </header>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div><div id="toast-root" role="status" aria-live="polite"></div>
<script>
'use strict';
(()=>{
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>[...root.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(value,digits=2)=>Number(value||0).toLocaleString(document.documentElement.lang==='en'?'en-US':'ru-RU',{minimumFractionDigits:digits,maximumFractionDigits:digits});
const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',cube:'<path d="m12 2 9 5-9 5-9-5 9-5ZM3 7v10l9 5 9-5V7M12 12v10"/>',wallet:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 10V5a2 2 0 0 1 2-2h13"/><path d="M16 15h5"/>',file:'<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v6h5M9 13h7M9 17h7"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',qr:'<rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><path d="M14 14h3v3h-3zm5 0h3m-3 3h3v5h-5v-3m-3 0v3"/>',chart:'<path d="M4 19V5M4 19h17M8 15v-5M13 15V7M18 15V3"/>',message:'<path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5l3-3h8a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M7 11h1m4 0h1m4 0h1"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',robot:'<rect x="3" y="6" width="18" height="15" rx="3"/><path d="M12 2v4M8 11h.1M16 11h.1M8 16h8"/>',x:'<path d="M5 5l14 14M19 5 5 19"/>',plus:'<path d="M12 5v14M5 12h14"/>',chevron:'<path d="m9 18 6-6-6-6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M5 17v4h14v-4"/>',check:'<path d="m4 12 5 5 11-11"/>',history:'<path d="M3 12a9 9 0 1 0 3-7M3 3v6h6M12 7v5l3 2"/>',switch:'<path d="m7 7 5-5 5 5M12 2v12m5 3-5 5-5-5m5 5V10"/>'};
function icon(n){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.info}</svg>`}
const nav=[{group:'',items:[['home','Главная','home']]},{group:'ОПЕРАЦИИ',items:[['payin','Pay-In','cube'],['payout','Pay-Out','wallet'],['payout-requests','Запросы Pay-Out','file'],['appeals','Апелляции','message']]},{group:'КАБИНЕТ',items:[['requisites','Реквизиты','card'],['wallet','Финансы','wallet'],['automation','Автоматизация','robot'],['settings','Настройки','gear'],['notifications','Уведомления','bell']]}];
const titles=Object.fromEntries(nav.flatMap(g=>g.items.map(i=>[i[0],i[1]])));
const initial=()=>({working:false,balance:0,reserved:0,insurance:0,rate:null,records:[],orders:[],walletOps:[],appeals:[],notifications:[],autoPayin:false,autoPayout:false,onlyActive:true,payoutSearchRequests:[]});
function load(){
 try{
  const key='ice-pay-demo-'+(sessionStorage.getItem('ice-pay-trader-id')||'guest');
  const saved=JSON.parse(localStorage.getItem(key));
  if(saved&&typeof saved==='object'&&Array.isArray(saved.records)&&Array.isArray(saved.orders)){
   const data={...initial(),...saved};
   // Remove only the built-in sample entries, preserving trader-created records.
   data.records=data.records.filter(r=>!((r.id==='D-001'&&r.name==='Образец реквизитов')||(r.id==='D-002'&&r.name==='Карта резервная')));
   data.orders=data.orders.filter(o=>!(o&&['MP-1042','MP-1041','MP-1040'].includes(o.id)&&['Pay-In','Pay-Out'].includes(o.kind)));
   // Legacy 0.66 USDT was a client-side placeholder, never a verified payment.
   if(Number(data.balance)===0.66&&(!Array.isArray(data.walletOps)||!data.walletOps.length))data.balance=0;
   if(!Array.isArray(data.walletOps))data.walletOps=[];
   if(!Array.isArray(data.appeals))data.appeals=[];
   if(!Array.isArray(data.notifications))data.notifications=[];
   if(!Array.isArray(data.payoutSearchRequests))data.payoutSearchRequests=[];
   return data;
  }
 }catch(e){}
 return initial();
}
let state=load();
// Working status and insurance deposits are NEVER authoritative in localStorage.
state.working=false;
state.insurance=0;
let financeReady=false,confirmedFinance=null;
const MIN_INSURANCE_USDT=500;
const AUTH_SERVICE='https://ice-pay-auth.onrender.com';
const canStartWork=()=>financeReady&&!!confirmedFinance?.workEligible;
const financeGateText=()=>!financeReady?'Проверка страхового депозита…':canStartWork()?'Страховой депозит подтверждён. Работа доступна.':'Для работы нужен подтверждённый страховой депозит.';
function syncWorkControls(){
 for(const input of document.querySelectorAll('#sidebar-work-switch,[data-toggle="working"]')){
  input.checked=!!state.working;
  input.disabled=false;
  input.title=financeGateText();
  input.setAttribute('aria-label',financeGateText());
 }
 const note=document.getElementById('ice-insurance-gate-label');
 if(note)note.textContent=financeGateText();
}
function useFinance(finance){
 financeReady=true;
 confirmedFinance=finance;
 state.insurance=Number(finance.confirmedInsuranceUSDT)||0;
 state.working=!!finance.working&&!!finance.workEligible;
 refresh();
 syncWorkControls();
}
async function refreshFinance(){
 const token=sessionStorage.getItem('ice-pay-trader-token');
 if(!token){financeReady=false;confirmedFinance=null;state.working=false;state.insurance=0;syncWorkControls();return}
 try{
  const result=await fetch(AUTH_SERVICE+'/v1/trader/finance',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
  if(!result.ok)throw Error('Нет ответа от сервера финансов');
  const data=await result.json();
  if(!data.finance||Number(data.finance.minimumInsuranceUSDT)!==MIN_INSURANCE_USDT)throw Error('Ответ сервера не прошёл проверку');
  useFinance(data.finance);
 }catch(e){
  financeReady=false;confirmedFinance=null;state.insurance=0;state.working=false;refresh();syncWorkControls();
 }
}
function denyUnverifiedWork(input){
 // This visual action never bypasses the server insurance-deposit gate.
 if(input)input.dataset.insurancePending='true';
 setTimeout(()=>{
  if(input){input.checked=false;delete input.dataset.insurancePending;}
  syncWorkControls();
  const note=document.getElementById('ice-insurance-gate-label');
  if(note){
   note.textContent='Для работы нужен подтверждённый страховой депозит.';
   note.classList.remove('ice-insurance-flash');
   void note.offsetWidth;
   note.classList.add('ice-insurance-flash');
  }
 },310);
}
async function requestWorking(desired,input){
 if(desired&&!canStartWork()){denyUnverifiedWork(input);return}
 syncWorkControls();
 const token=sessionStorage.getItem('ice-pay-trader-token');
 if(!token){toast('Сначала войдите в аккаунт трейдера');return}
 try{
  const response=await fetch(AUTH_SERVICE+'/v1/trader/work-status',{
   method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
   body:JSON.stringify({working:!!desired}),cache:'no-store'
  });
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Не удалось изменить рабочий статус');
  useFinance(data.finance);
  toast(data.finance.working?'Вы в работе':'Рабочий статус выключен');
 }catch(e){toast(e.message||'Не удалось проверить страховой депозит');await refreshFinance()}
}
window.addEventListener('onlymatch:trader-authenticated',()=>refreshFinance());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sessionStorage.getItem('ice-pay-trader-token'))refreshFinance()});
for(const o of state.orders||[]){if(o.currency==='KZT')o.currency='RUB'}for(const item of state.notifications||[]){if(typeof item.title==='string')item.title=item.title.replace(/Muslim Pay|Ice Pay|ICE PAY|ВОВА КОЛОКОЛЬЦЕВ/g,'OnlyMatch')}let currentPage='home',tabs={requisites:'all',payin:'all',payout:'all',appeals:'all'},searches={},selects={},dateRange='30',fromDate='2026-10-01',toDate='2026-10-30';
const save=()=>{try{localStorage.setItem('ice-pay-demo-'+(sessionStorage.getItem('ice-pay-trader-id')||'guest'),JSON.stringify(state))}catch(e){}};
const elem=(tag,className,text)=>{let el=document.createElement(tag);el.className=className;el.textContent=text;return el};
function toast(msg){const root=$('#toast-root');root.innerHTML='';root.appendChild(elem('div','toast',msg));setTimeout(()=>root.replaceChildren(),3400)}
function sidebar(){const navEl=$('#sidebar-nav');navEl.innerHTML=nav.map(group=>(group.group?`<div class="nav-heading">${group.group}</div>`:'')+group.items.map(([id,label,ico])=>`<a href="#/${id}" class="nav-link ${currentPage===id?'active':''}" data-nav="${id}">${icon(ico)}<span>${label}</span></a>`).join('')).join('');$('#sidebar-balance').textContent=money(state.balance-state.reserved);$('#sidebar-work-switch').checked=state.working;syncWorkControls()}
function openSidebar(){ $('#sidebar').classList.add('open');$('#sidebar-overlay').classList.add('open');document.body.style.overflow='hidden';$('#open-menu').setAttribute('aria-expanded','true') }
function closeSidebar(){ $('#sidebar').classList.remove('open');$('#sidebar-overlay').classList.remove('open');document.body.style.overflow='';$('#open-menu').setAttribute('aria-expanded','false') }
const title=(s)=>`<h1 class="page-title">${esc(s)}</h1><div class="page-title-rule"></div>`;
const metric=(label,value,dotColor='')=>`<div class="metric"><div class="metric-label"><i class="dot ${dotColor}"></i>${label}</div><div class="metric-value">${value}</div></div>`;
const workLabel=()=>`<span class="work-status ${state.working?'on':'off'}">${state.working?'В работе':'Не в работе'}</span>`;
function home(){return `${title('Главная')}<div class="section-card"><div class="section-header"><h2>Балансы</h2><button class="text-link" data-go="wallet">Открыть финансы</button></div><div class="metric-grid">${metric('<strong>USDT</strong> Общий баланс',money(state.balance)+' USDT')}${metric('<strong>USDT</strong> Доступно',money(Math.max(0,state.balance-state.reserved))+' USDT','green')}${metric('<strong>USDT</strong> В резерве',money(state.reserved)+' USDT','yellow')}${metric('<strong>USDT</strong> Страховой депозит',money(state.insurance)+' USDT','peach')}</div><h2 class="subsection-title">Рабочее состояние</h2><div class="metric-grid">${metric('Статус',workLabel())}${metric('Реквизиты',`${state.records.filter(r=>r.status==='active').length} из ${state.records.length} активны`)}${metric('Апелляции Pay-In',state.appeals.filter(a=>a.kind==='Pay-In'&&a.status!=='success').length)}${metric('Апелляции Pay-Out',state.appeals.filter(a=>a.kind==='Pay-Out'&&a.status!=='success').length)}</div><h2 class="stats-heading">Статистика и профит</h2><p class="stats-description">Профит считается по фактически начисленной комиссии завершённых сделок. Операции без серверного учёта не влияют на прибыль.</p><div class="period-toolbar"><label class="date-field">От<input type="date" id="date-from" value="${fromDate}"></label><label class="date-field">До<input type="date" id="date-to" value="${toDate}"></label><div class="period-pills">${[['today','Сегодня'],['yesterday','Вчера'],['7','7 дней'],['30','30 дней']].map(([v,l])=>`<button class="chip ${dateRange===v?'selected':''}" data-period="${v}">${l}</button>`).join('')}</div></div><div class="profit-strip"><div><small>Общий профит</small><strong>0,00 USDT</strong></div><div><small>Профит Pay-In</small><strong>0,00 USDT</strong></div><div><small>Профит Pay-Out</small><strong>0,00 USDT</strong></div></div><div class="stat-panels">${statPanel('Pay-In')}${statPanel('Pay-Out')}</div></div>`}
function statPanel(kind){return `<div class="stat-panel"><div class="stat-panel-head"><div class="stat-panel-label"><small>Выполнено платежей</small><strong class="${kind==='Pay-Out'?'payout':''}">${kind}</strong></div><div class="conversion">Конверсия<br>0%</div></div><div class="stat-panel-grid"><div class="stat-cell"><small>Создано</small><strong>0</strong></div><div class="stat-cell"><small>Успешно</small><strong class="good">0</strong></div><div class="stat-cell"><small>Оборот</small><strong>0 RUB</strong></div><div class="stat-cell"><small>Средний чек</small><strong>0 RUB</strong></div></div><div class="stat-panel-foot"><div><small>Профит трейдера</small><strong>0,00 USDT</strong></div><div><small>Отменено</small><strong style="color:#ff8e95">0</strong></div></div></div>`}
const statusMap={pending:'В обработке',success:'Успешно',expired:'Истекло',failed:'Ошибка',active:'Активен',inactive:'Неактивен',archived:'Архив',paid:'Оплачено'};
const statusTag=s=>`<span class="status-pill ${esc(s)}">${esc(statusMap[s]||s)}</span>`;
const dateFmt=s=>{try{return new Date(s).toLocaleString(document.documentElement.lang==='en'?'en-GB':'ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}};
function tabBar(name,items){return `<div class="segmented" role="tablist">${items.map(([v,l])=>`<button type="button" role="tab" aria-selected="${(tabs[name]||'all')===v}" class="${(tabs[name]||'all')===v?'active':''}" data-tab="${name}:${v}">${l}</button>`).join('')}</div>`}
function orderList(which){let q=(searches[which]||'').toLowerCase(), status=tabs[which]||'all';let data=state.orders.filter(x=>which==='all'||x.kind===(which==='payin'?'Pay-In':'Pay-Out'));if(status!=='all')data=data.filter(x=>x.status===status);if(q)data=data.filter(x=>(x.id+' '+x.currency+' '+x.amount).toLowerCase().includes(q));return `<div class="table-wrap"><table class="data-table"><thead><tr><th>№ заявки</th><th>Тип</th><th>Сумма</th><th>Статус</th><th>Создано</th><th>Детали</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.kind)}</td><td><strong>${money(x.amount,0)} ${esc(x.currency)}</strong></td><td>${statusTag(x.status)}</td><td>${dateFmt(x.created)}</td><td><button class="table-link" data-detail="order:${esc(x.id)}">Открыть</button></td></tr>`).join('')||`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:35px">Нет заявок по заданным фильтрам</td></tr>`}</tbody></table></div>`}
function transactions(which){return `${title(which==='payin'?'Pay-In':'Pay-Out')}<div class="action-row"><button class="secondary-button" data-export="${which}">${icon('download')} Экспорт CSV</button></div><div class="section-card"><div class="section-header"><h2>История ${which==='payin'?'Pay-In':'Pay-Out'}</h2><span class="volume-small">Всего: ${state.orders.filter(x=>x.kind===(which==='payin'?'Pay-In':'Pay-Out')).length}</span></div><div class="filters">${tabBar(which,[['all','Все'],['pending','Активные'],['success','Успешные'],['expired','Истекшие']])}<input type="search" data-search="${which}" value="${esc(searches[which]||'')}" placeholder="Поиск по номеру и сумме"></div>${orderList(which)}</div>`}

   '<label class="form-field">ФИО владельца (необязательно)<input name="holder" type="text" autocomplete="off" maxlength="90" placeholder="Фамилия Имя Отчество" value="'+esc(draft.holder)+'"></label>'+
   '<p class="om-req-error" role="alert" aria-live="polite"></p>'+
   '<div class="om-req-footer"><button type="button" class="secondary-button" data-modal-close="true">Отмена</button><button type="submit" class="gradient-button">Продолжить →</button></div>'+
   '</form>');
  const form=$('#om-req-step-one'),kind=form.elements.type,account=form.elements.account;
  function updateKind(changed){
   const sbp=kind.value==='СБП';
   $('#om-req-number-label').textContent=sbp?'Номер телефона СБП':'Номер банковской карты';
   const keepCard=!!editing&&!sbp&&editing.type!=='СБП'&&!!originalCard;
   $('#om-req-number-hint').textContent=sbp?'Обязательно +7 и 10 цифр номера.':keepCard?'Новый номер карты или оставьте поле пустым, чтобы сохранить текущий номер.':'Введите от 16 до 19 цифр.';
   account.required=sbp||!keepCard;
   account.placeholder=sbp?'+7 999 123-45-67':(keepCard?'Оставьте пустым для сохранения номера':'0000 0000 0000 0000');
   account.inputMode=sbp?'tel':'numeric';
   account.maxLength=sbp?18:25;
   if(changed)account.value=sbp?'+7':'';
   else if(account.value)account.value=sbp?formatPhone(account.value):tidyCard(account.value);
   else if(sbp)account.value='+7';
  }
  kind.addEventListener('change',()=>updateKind(true));
  account.addEventListener('input',()=>{const old=account.value;account.value=kind.value==='СБП'?formatPhone(old):tidyCard(old)});
  updateKind(false);
  form.addEventListener('submit',event=>{
   event.preventDefault();
   const name=String(form.elements.name.value||'').trim();
   const type=kind.value;
   const raw=String(account.value||'').trim();
   const holder=String(form.elements.holder.value||'').trim().replace(/\s+/g,' ');
   if(!name||name.length>50)return setError(form,'Введите название реквизитов.');
   if(type==='Банковская карта'){
    if(!(editing&&editing.type!=='СБП'&&!getDigits(raw)&&originalCard)&&!/^\d{16,19}$/.test(getDigits(raw)))return setError(form,'Номер карты должен содержать от 16 до 19 цифр.');
   }else if(type==='СБП'){
    if(!/^\+7\s*\d{3}\s*\d{3}[-\s]*\d{2}[-\s]*\d{2}$/.test(raw)&&!/^\+7\d{10}$/.test(raw))
     return setError(form,'Введите номер СБП в формате +7 999 123-45-67.');
   }else return setError(form,'Выберите банковскую карту или СБП.');
   Object.assign(draft,{name,type,account:type==='СБП'?formatPhone(raw):tidyCard(raw),holder});
   stepTwo();
  });
 }
 function stepTwo(){
  const summary=draft.type==='Банковская карта'?(draft.account?'•••• '+getDigits(draft.account).slice(-4):originalCard):draft.account;
  modal(editing?'Редактировать реквизиты':'Создать реквизиты',markupSteps(2)+
   '<div class="om-req-summary"><strong>'+esc(draft.name)+'</strong>'+esc(draft.type)+' · '+esc(summary)+'<div>'+(draft.holder?esc(draft.holder):'ФИО не указано')+'</div></div>'+
   '<p class="om-req-intro">Укажите лимиты одного платежа, общую сумму поступлений на реквизит и количество активных ордеров.</p>'+
   '<form id="om-req-step-two">'+
   '<div class="om-req-fields">'+
    '<label class="form-field">Минимальный платёж, ₽<input type="number" name="minPaymentRub" inputmode="numeric" min="1" max="100000000" step="1" placeholder="Например, 1000" required value="'+esc(draft.minPaymentRub)+'"></label>'+
    '<label class="form-field">Максимальный платёж, ₽<input type="number" name="maxPaymentRub" inputmode="numeric" min="1" max="100000000" step="1" placeholder="Например, 100000" required value="'+esc(draft.maxPaymentRub)+'"></label>'+
    '<label class="form-field om-req-wide">Лимит суммы на реквизит, ₽<input type="number" name="totalLimitRub" inputmode="numeric" min="1" max="1000000000000" step="1" placeholder="Например, 500000" required value="'+esc(draft.totalLimitRub)+'"><small class="om-req-hint">Максимальная общая сумма поступлений на эти реквизиты.</small></label>'+ 
    '<label class="form-field om-req-wide">Максимальное количество активных ордеров<input type="number" name="maxActiveOrders" inputmode="numeric" min="1" max="1000" step="1" placeholder="Например, 5" required value="'+esc(draft.maxActiveOrders)+'"><small class="om-req-hint">Сколько заявок может находиться в работе одновременно на этих реквизитах.</small></label>'+
   '</div>'+
   
   '<p class="om-req-error" role="alert" aria-live="polite"></p>'+
   '<div class="om-req-footer"><button type="button" class="secondary-button" id="om-req-back">← Назад</button><button type="submit" class="gradient-button">'+(editing?'Сохранить изменения':'Создать реквизиты')+'</button></div>'+
   '</form>');
  const form=$('#om-req-step-two');
  form.querySelector('#om-req-back').addEventListener('click',()=>{
   draft.minPaymentRub=form.elements.minPaymentRub.value;
   draft.maxPaymentRub=form.elements.maxPaymentRub.value;
   draft.totalLimitRub=form.elements.totalLimitRub.value;
   draft.maxActiveOrders=form.elements.maxActiveOrders.value;
   stepOne();
  });
  form.addEventListener('submit',event=>{
   event.preventDefault();
   const min=Number(form.elements.minPaymentRub.value);
   const max=Number(form.elements.maxPaymentRub.value);
   const totalLimit=Number(form.elements.totalLimitRub.value);
   const orders=Number(form.elements.maxActiveOrders.value);
   if(!Number.isSafeInteger(min)||min<1||min>100000000)return setError(form,'Укажите минимальную сумму от 1 до 100 000 000 ₽.');
   if(!Number.isSafeInteger(max)||max<1||max>100000000)return setError(form,'Укажите максимальную сумму от 1 до 100 000 000 ₽.');
   if(max<min)return setError(form,'Максимальный лимит не может быть меньше минимального.');
   if(!Number.isSafeInteger(totalLimit)||totalLimit<1||totalLimit>1000000000000)return setError(form,'Введите общий лимит от 1 до 1 000 000 000 000 ₽.');
   if(totalLimit<max)return setError(form,'Общий лимит реквизита не может быть меньше максимального платежа.');
   if(!Number.isSafeInteger(orders)||orders<1||orders>1000)return setError(form,'Количество активных ордеров — целое число от 1 до 1000.');
   // A card number is masked in local storage; editing can retain the saved last four digits.
   const displayNumber=draft.type==='Банковская карта'?(draft.account?'•••• '+getDigits(draft.account).slice(-4):originalCard):draft.account;
   const values={name:draft.name,type:draft.type,detail:displayNumber,holder:draft.holder,
     minPaymentRub:min,maxPaymentRub:max,totalLimitRub:totalLimit,maxActiveOrders:orders};
   if(editing){
     Object.assign(editing,values,{updatedAt:new Date().toISOString()});
     addNotice('Реквизиты изменены',draft.name);
   }else{
     state.records.unshift({id:randId('R'),...values,status:'inactive',createdAt:new Date().toISOString()});
     addNotice('Реквизиты созданы',draft.name);
     tabs.requisites='all';selects.reqstatus='all';
   }
   closeModal();refresh();toast(editing?'Реквизиты обновлены':'Реквизиты созданы. Статус: неактивен');
  });
 }
 stepOne();
}

// A search request is NOT a payout order. Card data is masked before browser storage.
function openPayoutSearchWizard(){
 const draft={min:0,max:0,method:'sbp'};
 const heading=step=>'<div class="om-ps-steps"><span class="'+(step===1?'on':'')+'">1. Лимиты</span><span class="'+(step===2?'on':'')+'">2. Способ выплаты</span><span class="'+(step===3?'on':'')+'">3. Проверка</span></div>';
 const formError=(form,msg)=>{const el=form.querySelector('.om-ps-error');if(el)el.textContent=msg;};
 function amounts(){
  modal('Новый запрос на поиск Pay-Out',heading(1)+
   '<p class="om-ps-intro">В каком диапазоне сумм искать Pay-Out?</p>'+
   '<form id="om-ps-limits"><div class="om-ps-limits">'+
   '<label class="form-field">Сумма от, ₽<input name="min" type="number" min="1" max="100000000" step="1" inputmode="numeric" value="'+(draft.min||'')+'" placeholder="Например, 5 000" required></label>'+
   '<label class="form-field">Сумма до, ₽<input name="max" type="number" min="1" max="100000000" step="1" inputmode="numeric" value="'+(draft.max||'')+'" placeholder="Например, 20 000" required></label></div>'+
   '<p class="om-ps-error" role="alert" aria-live="polite"></p>'+
   '<div class="modal-footer"><button type="button" class="secondary-button" data-modal-close="true">Отмена</button><button type="submit" class="gradient-button">Продолжить</button></div></form>');
  const form=$('#om-ps-limits');
  form.addEventListener('submit',e=>{
   e.preventDefault();
   const a=Number(form.elements.min.value),b=Number(form.elements.max.value);
   if(!Number.isSafeInteger(a)||a<1||a>100000000)return formError(form,'Укажите минимальную сумму от 1 до 100 000 000 ₽.');
   if(!Number.isSafeInteger(b)||b<a||b>100000000)return formError(form,'Максимальная сумма должна быть не меньше минимальной.');
   draft.min=a;draft.max=b;
   payoutMethod();
  });
 }
 function payoutMethod(){
  modal('Новый запрос на поиск Pay-Out',heading(2)+
   '<p class="om-ps-intro">Какую выплату нужно найти? Выберите только тип, вводить номер карты или телефона не требуется.</p>'+
   '<form id="om-ps-method">'+
   '<label class="form-field">Способ выплаты<select name="method" required>'+
   '<option value="sbp"'+(draft.method==='sbp'?' selected':'')+'>СБП (по номеру телефона)</option>'+
   '<option value="card"'+(draft.method==='card'?' selected':'')+'>Банковская карта РФ</option>'+
   '</select></label>'+
   '<p class="om-ps-error" role="alert" aria-live="polite"></p>'+
   '<div class="modal-footer"><button type="button" class="secondary-button" id="om-ps-back-limits">← Назад</button><button type="submit" class="gradient-button">Продолжить</button></div></form>');
  const form=$('#om-ps-method');
  form.querySelector('#om-ps-back-limits').addEventListener('click',()=>{
   draft.method=form.elements.method.value;
   amounts();
  });
  form.addEventListener('submit',e=>{
   e.preventDefault();
   const kind=form.elements.method.value;
   if(kind!=='sbp'&&kind!=='card')return formError(form,'Выберите СБП или банковскую карту.');
   draft.method=kind;
   review();
  });
 }
 function review(){
  const label=draft.method==='sbp'?'СБП':'Банковская карта РФ';
  modal('Проверьте запрос Pay-Out',heading(3)+

   closeModal();tabs.payoutRequests='all';refresh();toast('Запрос Pay-Out сохранён в браузере');
  });
 }
 amounts();
}

function archiveRequisite(r){
 if(!r||!state.records.includes(r)||r.status==='archived')return;
 if(!confirm('Переместить реквизит «'+r.name+'» в архив?'))return;
 r.status='archived';r.archivedAt=new Date().toISOString();
 closeModal();tabs.requisites='archived';selects.reqstatus='all';refresh();
 toast('Реквизит перемещён в архив');
}
function restoreRequisite(r){
 if(!r||!state.records.includes(r)||r.status!=='archived')return;
 r.status='inactive';r.updatedAt=new Date().toISOString();
 closeModal();tabs.requisites='all';selects.reqstatus='all';refresh();
 toast('Реквизит восстановлен, статус: неактивен');
}
async function deleteArchivedRequisite(r){
 if(!r||!state.records.includes(r)||r.status!=='archived'){
  toast('Удалить можно только реквизит в архиве');return;
 }
 if(!confirm('Удалить реквизит «'+r.name+'» из кабинета? В истории Owner останется запись.'))return;
 const token=sessionStorage.getItem('ice-pay-trader-token');
 if(!token){toast('Для удаления требуется вход трейдера');return}
 const btns=[...document.querySelectorAll('[data-requisite-delete],#delete-requisite-detail')].filter(b=>b.id==='delete-requisite-detail'||b.dataset.requisiteDelete===r.id);
 btns.forEach(b=>b.disabled=true);
 try{
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);
  let response;
  try{
   response=await fetch('https://ice-pay-auth.onrender.com/v1/trader/requisites/deletions',{
    method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
    cache:'no-store',signal:controller.signal,
    body:JSON.stringify({requisite:{id:r.id,name:r.name,type:r.type,detail:r.detail,
      holder:r.holder||'',createdAt:r.createdAt||'',archivedAt:r.archivedAt||'',
      minPaymentRub:r.minPaymentRub,maxPaymentRub:r.maxPaymentRub,
      totalLimitRub:r.totalLimitRub,maxActiveOrders:r.maxActiveOrders,status:r.status}})
   });
  }finally{clearTimeout(timer)}
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.ok)throw Error(result.error||'Не удалось записать историю удаления');
  const index=state.records.findIndex(x=>x===r&&x.status==='archived');
  if(index>=0)state.records.splice(index,1);
  closeModal();refresh();toast('Реквизит удалён, запись сохранена в истории Owner');
 }catch(err){toast(err.name==='AbortError'?'Сервер истории не ответил. Удаление отменено.':err.message||'Ошибка удаления')}
 finally{btns.forEach(b=>b.disabled=false)}
}

  <script id="ice-blue-responsive-tables">
/* Add mobile column labels to dynamic tables without altering desktop semantics. */
(() => {
  'use strict';
  const root = document.querySelector('#page');
  if (!root) return;
  const annotate = () => {
    for (const table of document.querySelectorAll('.data-table')) {
      const labels = [...table.querySelectorAll('thead th')].map(th => th.textContent.trim());
      for (const row of table.querySelectorAll('tbody tr')) {
        [...row.querySelectorAll('td')].forEach((cell, i) => {
          if (!cell.hasAttribute('colspan')) cell.dataset.label = labels[i] || '';
        });
      }
    }
  };
  annotate();
  new MutationObserver(annotate).observe(root, {subtree:true, childList:true});
})();

<script id="onlymatch-market-rate">
/* OnlyMatch market quote: verified Rapira USDT/RUB bid, never FX or reference fallback. */
(()=>{
 'use strict';
 const RAPIRA_API='https://api.rapira.net/open/market/rates';
 const MARKET_PROXY='https://ice-pay-rates.onrender.com/rate';
 const STORAGE_KEY='onlymatch-rapira-usdt-rub-market-v3';
 const MAX_AGE=5*60*1000;
 const REFRESH_MS=30000;
 let quote=null,loading=false;
 const now=()=>Date.now();
 function validPrice(value){
  const n=Number(value);
  if(!Number.isFinite(n)||n<=0||n>10000)throw new Error('Invalid market bid');
  return n;
 }
 function parseRapira(payload){
  const row=payload?.data?.find?.(item=>item.symbol==='USDT/RUB');
  if(!row)throw new Error('USDT/RUB pair missing');
  return {price:validPrice(row.bidPrice),time:now(),stale:false};
 }
 function parseMarketProxy(payload){
  if(payload?.symbol!=='USDT/RUB')throw new Error('Unexpected market pair');
  // Never silently replace Rapira quotes with a USDT/USD, central bank or reference FX rate.
  const source=String(payload.type||'')+' '+String(payload.source||'')+' '+String(payload.provider||'');
  if(/reference|coingecko|fallback|central.?bank|cbr|fx/i.test(source))throw new Error('Not a Rapira market quote');
  const time=Date.parse(payload.updatedAt);
  const age=now()-time;
  if(!Number.isFinite(time)||age<-(2*60*1000)||age>MAX_AGE)throw new Error('Stale proxy quote');
  return {price:validPrice(payload.bidPrice),time,stale:false};
 }
 function fromCache(){
  try{
   const cached=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
   const age=now()-cached?.time;
   if(!Number.isFinite(age)||age<0||age>MAX_AGE)return null;
   return {price:validPrice(cached.price),time:cached.time,stale:true};
  }catch{return null;}
 }
 function saveQuote(value){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({price:value.price,time:value.time}));}catch{}
 }
 function render(){
  let value='Курс недоступен',caption='Нет подтверждённых рыночных данных';
  if(quote&&now()-quote.time<=MAX_AGE){
   value=quote.price.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽ / USDT';
   const clock=new Date(quote.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
   caption=(quote.stale?'Последний подтверждённый курс':'Рыночный курс продажи')+' · '+clock;
  }
  for(const el of document.querySelectorAll('[data-usdt-rub-rate]'))if(el.textContent!==value)el.textContent=value;
  for(const el of document.querySelectorAll('[data-usdt-rub-status]'))if(el.textContent!==caption)el.textContent=caption;
 }
 async function loadJson(url,timeout){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
   const response=await fetch(url,{method:'GET',mode:'cors',cache:'no-store',headers:{Accept:'application/json'},signal:controller.signal});
   if(!response.ok)throw new Error('Rate request failed: '+response.status);
   return await response.json();
  }finally{clearTimeout(timer);}
 }
 async function currentMarketQuote(){
  // Direct official market API has priority; the proxy is only a market-data fallback.
  try{
   return parseRapira(await loadJson(RAPIRA_API,6500));
  }catch(directError){
   try{
    return parseMarketProxy(await loadJson(MARKET_PROXY,8000));
   }catch(proxyError){
    console.warn('OnlyMatch: Rapira quote unavailable',directError,proxyError);
    throw proxyError;
   }
  }
 }
 async function refreshRate(){
  if(loading)return;
  if(navigator.onLine===false){
   if(!quote||now()-quote.time>MAX_AGE)quote=fromCache();
   if(quote)quote.stale=true;
   render();
   return;
  }
  loading=true;
  try{
   const fresh=await currentMarketQuote();
   quote=fresh;saveQuote(fresh);
  }catch{
   if(!quote||now()-quote.time>MAX_AGE)quote=fromCache();
   if(quote)quote.stale=true;
  }finally{loading=false;render();}
 }
 quote=fromCache();render();refreshRate();
 const page=document.querySelector('#page');
 if(page)new MutationObserver(render).observe(page,{childList:true});
 setInterval(()=>{if(!document.hidden)refreshRate();else render();},REFRESH_MS);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRate()});
 window.addEventListener('online',refreshRate);
})();
</script>

const TOKEN='ice-pay-trader-token';
const get=id=>document.getElementById(id);
const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const overlay=document.createElement('div');overlay.className='ice-auth-overlay';overlay.id='ice-auth-overlay';
overlay.innerHTML='<section class="ice-auth-card"><div class="ice-auth-logo">Only<span>Match</span></div><h1>Вход для трейдеров</h1><p>Войдите в кабинет под индивидуальным логином и паролем, выданными администратором OnlyMatch.</p><form id="ice-trader-login-form"><label for="ice-login">Логин</label><input id="ice-login" name="username" autocomplete="username" autocapitalize="off" required minlength="1" maxlength="64"><label for="ice-password">Пароль</label><input id="ice-password" type="password" name="password" autocomplete="current-password" required><button type="submit">Войти в OnlyMatch</button><div class="ice-auth-error" id="ice-auth-error" role="alert"></div></form><div class="ice-auth-footer">Логин создаётся владельцем в отдельной админке. Финансовые данные кабинета пока сохраняются локально в браузере.</div></section>';
document.body.append(overlay);
const error=message=>{get('ice-auth-error').textContent=message==null?'':String(message)};
if(sessionStorage.getItem('onlymatch-password-changed')==='1'){
 sessionStorage.removeItem('onlymatch-password-changed');
 get('ice-auth-error').style.color='#23856b';
 error('Пароль успешно изменён. Войдите с новым паролем.');
}
async function api(path,opts={}){
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),16000);
 try{
  const res=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})},cache:'no-store',signal:ctl.signal});
  let data;try{data=await res.json()}catch{data={}}
  if(!res.ok)throw Error(data.error||'Сервер входа недоступен');
  return data;
 }finally{clearTimeout(timer)}
}
function show(account){
 sessionStorage.setItem('ice-pay-trader-id',account.id);
 sessionStorage.setItem('ice-pay-trader-username',account.username);
 if(get('user-button'))get('user-button').textContent=account.username;
 document.documentElement.classList.add('ice-auth-ok');
 overlay.remove();
 window.dispatchEvent(new Event('onlymatch:trader-authenticated'));
}
async function verifyExisting(){
 const token=sessionStorage.getItem(TOKEN);
 if(!token)return;
 try{
  const data=await api('/v1/auth/me',{headers:{Authorization:'Bearer '+token}});
  if(data.account?.role!=='trader')throw Error('Только трейдерам доступен этот кабинет');
  show(data.account);
 }catch(e){
  sessionStorage.removeItem(TOKEN);sessionStorage.removeItem('ice-pay-trader-id');
  error('Сессия завершена. Войдите снова.');
 }
}
get('ice-trader-login-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;get('ice-auth-error').style.color='';error('');
 try{
  const d=new FormData(e.target);
  const data=await api('/v1/auth/login',{method:'POST',body:JSON.stringify({username:String(d.get('username')).trim(),password:d.get('password'),role:'trader'})});
  if(data.account?.role!=='trader'||!data.token)throw Error('Нет доступа к кабинету трейдера');
  sessionStorage.setItem(TOKEN,data.token);
  sessionStorage.setItem('ice-pay-trader-id',data.account.id);
  location.reload(); // loads isolated demo data for this account
 }catch(ex){error(ex.message==='Failed to fetch'?'Сервер авторизации недоступен':ex.message);btn.disabled=false;}
});
get('exit-button')?.addEventListener('click',e=>{
 e.preventDefault();e.stopImmediatePropagation();
 const token=sessionStorage.getItem(TOKEN);
 sessionStorage.removeItem(TOKEN);sessionStorage.removeItem('ice-pay-trader-id');sessionStorage.removeItem('ice-pay-trader-username');
 if(token)fetch(API+'/v1/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).catch(()=>{});
 location.reload();
},true);
verifyExisting();
})();
</script>
<script id="ice-ton-deposit-ui">
(()=>{
'use strict';
const API='https://ice-pay-auth.onrender.com';
const ROOT_ID='ice-ton-root';
const ADDRESS_LENGTH=48;
let address='',memo='';
const escapeText=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function root(){
 let el=document.getElementById(ROOT_ID);
 if(!el){el=document.createElement('div');el.id=ROOT_ID;document.body.appendChild(el)}
 return el;
}
function close(){
 const el=document.getElementById(ROOT_ID);
 if(el)el.replaceChildren();
 if(!document.getElementById('ice-auth-overlay'))document.body.style.overflow='';
}
function shell(body){
 root().innerHTML='<div class="ice-ton-overlay" data-ice-ton-overlay><section class="ice-ton-dialog" role="dialog" aria-modal="true" aria-label="TON депозит"><div class="ice-ton-title-row"><div><span class="ice-ton-chip">TON · Mainnet</span><h2>Пополнение TON</h2></div><button class="ice-ton-close" type="button" data-ice-ton-close aria-label="Закрыть">×</button></div>'+body+'</section></div>';
 document.body.style.overflow='hidden';
}

async function open(){
 if(!document.documentElement.classList.contains('ice-auth-ok'))return;
 const token=sessionStorage.getItem('ice-pay-trader-token');
 if(!token){shell('<div class="ice-ton-status error">Необходимо войти в аккаунт трейдера.</div>');return;}
 shell('<div class="ice-ton-loading">Загружаем ваши персональные реквизиты…</div>');
 try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),16000);
   let response;
   try{response=await fetch(API+'/v1/trader/ton-deposit',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store',signal:controller.signal})}
   finally{clearTimeout(timer)}
   const data=await response.json();
   if(!response.ok)throw new Error(data.error||'Сервис недоступен');
   if(data.asset!=='TON'||data.network!=='TON Mainnet'||data.status!=='preview_only'||data.autoCreditEnabled!==false)throw new Error('Неверный режим TON-депозита');
   if(typeof data.address!=='string'||data.address.length!==ADDRESS_LENGTH||typeof data.memo!=='string'||!data.memo)throw new Error('Реквизиты не получены');
   address=data.address;memo=data.memo;
   if(!root().querySelector('.ice-ton-overlay'))return;
   shell('<div class="ice-ton-details"><div class="ice-ton-field"><label>Сеть / монета</label><div class="ice-ton-value">TON Mainnet · TON (Toncoin)</div></div>'+
   '<div class="ice-ton-field"><label>Адрес кошелька OnlyMatch</label><div class="ice-ton-value mono">'+escapeText(address)+'</div><div class="ice-ton-btnrow"><button class="ice-ton-copy" type="button" data-ice-ton-copy="address">Скопировать адрес</button></div></div>'+
   '<div class="ice-ton-field"><label>Мемо</label><div class="ice-ton-value mono ice-ton-memo-protected" data-ice-ton-memo draggable="false">'+escapeText(memo)+'</div></div>'+
   '</div>'+

   '<div class="ice-ton-brief">Входящие TON не учитываются в балансе кабинета.</div>'+ 
   '<div id="ice-ton-status" role="status" aria-live="polite" class="ice-ton-status"></div>');
 }catch(err){
   if(root().querySelector('.ice-ton-overlay'))shell('<div class="ice-ton-status error" role="alert">'+escapeText(err.message==='Failed to fetch'?'Не удалось связаться с сервером авторизации':err.message)+'</div><button class="ice-ton-copy" data-ice-ton-retry type="button">Попробовать снова</button>');
 }
}
document.addEventListener('click',async e=>{
 const trigger=e.target.closest('[data-ice-ton]');
 if(trigger){
  if(trigger.dataset.iceTon==='open'){e.preventDefault();open();}
  return;
 }
 if(e.target.closest('[data-ice-ton-close]')||e.target.hasAttribute('data-ice-ton-overlay')){close();return;}
 if(e.target.closest('[data-ice-ton-retry]')){open();return;}
 const copy=e.target.closest('[data-ice-ton-copy]');
 if(!copy)return;
 const val=address;
 const status=document.getElementById('ice-ton-status');
 if(!val)return;
 try{
  await navigator.clipboard.writeText(val);
  if(status)status.textContent='Адрес скопирован';
 }catch{
  if(status){status.className='ice-ton-status error';status.textContent='Не получилось скопировать. Выделите значение вручную.'}
 }
});
document.addEventListener('selectstart',e=>{if(e.target.closest?.('[data-ice-ton-memo]'))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.closest?.('[data-ice-ton-memo]'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.ice-ton-overlay'))close()});
})();
</script>
</body>
</html>
